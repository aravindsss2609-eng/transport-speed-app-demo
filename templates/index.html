<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Kinematics Engine</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #060913;
            --bg-surface: rgba(15, 23, 42, 0.75);
            --accent-cyan: #00f3ff;
            --accent-magenta: #ff0055;
            --text-main: #f1f5f9;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background: linear-gradient(135deg, #03050a 0%, #091020 100%);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            min-height: 100vh;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
            max-width: 1600px;
            margin: 0 auto;
        }

        @media (max-width: 1024px) {
            .dashboard-grid { grid-template-columns: 1fr; }
        }

        .panel {
            background: var(--bg-surface);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 243, 255, 0.2);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
        }

        h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 0;
            color: var(--accent-cyan);
            border-bottom: 1px solid rgba(255,255,255,0.08);
            padding-bottom: 8px;
        }

        .speedometer-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 0;
        }

        .speed-display {
            font-family: 'Orbitron', sans-serif;
            font-size: 6rem;
            font-weight: 700;
            color: var(--accent-cyan);
            text-shadow: 0 0 25px rgba(0, 243, 255, 0.6);
            line-height: 1;
        }

        .unit { font-size: 1.3rem; color: #94a3b8; font-family: 'Orbitron', sans-serif; margin-top: 8px;}

        .btn-stream {
            width: 100%;
            background: transparent;
            border: 2px solid var(--accent-cyan);
            color: var(--accent-cyan);
            padding: 15px;
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-stream.active {
            border-color: var(--accent-magenta);
            color: var(--accent-magenta);
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.35);
        }

        #map {
            height: 420px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.08);
        }

        .telemetry-metrics {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 20px;
        }

        .metric-card {
            background: rgba(255, 255, 255, 0.02);
            padding: 12px 15px;
            border-radius: 8px;
            border-left: 3px solid var(--accent-cyan);
        }

        .metric-card.highlight {
            border-left-color: var(--accent-magenta);
        }

        .metric-label { font-size: 0.8rem; color: #64748b; text-transform: uppercase; letter-spacing: 1px; }
        .metric-value { font-size: 1.35rem; font-weight: bold; margin-top: 4px; }
    </style>
</head>
<body>

<div class="dashboard-grid">
    <div class="panel">
        <h2>System Telemetrics</h2>
        <div class="speedometer-container">
            <div class="speed-display" id="speedValue">00.0</div>
            <div class="unit">KM / H</div>
        </div>
        
        <button class="btn-stream" id="toggleBtn" onclick="toggleTelemetryStream()">START CALCULATING</button>
        
        <div class="telemetry-metrics">
            <div class="metric-card highlight">
                <div class="metric-label">Transport Mode</div>
                <div class="metric-value" id="modeValue" style="color: var(--accent-magenta);">Awaiting Stream</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">Odometer</div>
                <div class="metric-value" id="distanceValue" style="color: var(--accent-cyan);">0.000 km</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">Acceleration</div>
                <div class="metric-value" id="accelValue">0.00 m/s²</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">G-Force Load</div>
                <div class="metric-value" id="gForceValue">0.00 G</div>
            </div>
            <div class="metric-card" style="grid-column: span 2;">
                <div class="metric-label">Lat / Lng</div>
                <div class="metric-value" id="geoCoords" style="font-size:1.05rem; font-family: monospace;">0.0000, 0.0000</div>
            </div>
        </div>
    </div>

    <div class="panel">
        <h2>Geospatial Processing Grid</h2>
        <div id="map"></div>
        <div style="margin-top: 15px;">
            <canvas id="realtimeChart" height="110"></canvas>
        </div>
    </div>
</div>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
    let socket;
    let watchId = null;
    let isStreaming = false;
    let map, pathPolyline, vehicleMarker;
    let realtimeChart;
    
    // Local memory cache matrices
    let clientLat = null, clientLng = null, clientTs = null;

    function initMap() {
        map = L.map('map', { zoomControl: false }).setView([0, 0], 2);
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);
        
        pathPolyline = L.polyline([], {color: '#00f3ff', weight: 4, opacity: 0.85}).addTo(map);
        vehicleMarker = L.circleMarker([0, 0], {
            color: '#ff0055', fillColor: '#ff0055', fillOpacity: 0.9, radius: 8, weight: 2
        }).addTo(map);

        if ("geolocation" in navigator) {
            navigator.geolocation.getCurrentPosition(pos => {
                const lat = pos.coords.latitude;
                const lng = pos.coords.longitude;
                map.setView([lat, lng], 14);
                vehicleMarker.setLatLng([lat, lng]);
                document.getElementById('geoCoords').innerText = lat.toFixed(6) + ", " + lng.toFixed(6);
            }, null, { enableHighAccuracy: true });
        }
    }

    function initChart() {
        const ctx = document.getElementById('realtimeChart').getContext('2d');
        realtimeChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: 'Velocity',
                    data: [],
                    borderColor: '#00f3ff',
                    borderWidth: 2,
                    pointRadius: 0,
                    fill: true,
                    backgroundColor: 'rgba(0, 243, 255, 0.03)',
                    tension: 0.15
                }]
            },
            options: {
                responsive: true,
                plugins: { legend: { display: false } },
                scales: {
                    x: { grid: { display: false }, ticks: { color: '#64748b', font: { family: 'Rajdhani' } } },
                    y: { grid: { color: 'rgba(255,255,255,0.03)' }, ticks: { color: '#64748b', font: { family: 'Rajdhani' } } }
                }
            }
        });
    }

    function computeLocalFallbackSpeed(lat1, lon1, lat2, lon2, timeDeltaMs) {
        if (timeDeltaMs <= 0) return 0;
        const R = 6371.0;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                  Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                  Math.sin(dLon/2) * Math.sin(dLon/2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        const distanceKm = R * c;
        const hours = timeDeltaMs / 3600000.0;
        return (distanceKm / hours) / 3.6; // Returns meters per second to match payload requirements
    }

    function toggleTelemetryStream() {
        const btn = document.getElementById('toggleBtn');
        if (!isStreaming) {
            socket = io.connect(window.location.origin, {
                transports: ['websocket'],
                upgrade: false,
                forceNew: true
            });

            socket.on('connect', () => { socket.emit('start_calculation'); });

            socket.on('telemetry_processed', (data) => {
                document.getElementById('accelValue').innerText = data.acceleration.toFixed(2) + " m/s²";
                document.getElementById('gForceValue').innerText = data.g_force.toFixed(2) + " G";
                document.getElementById('distanceValue').innerText = data.distance_travelled_km.toFixed(3) + " km";
                document.getElementById('speedValue').innerText = data.speed.toFixed(1);
                document.getElementById('modeValue').innerText = data.predicted_mode;

                const timeLabel = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                realtimeChart.data.labels.push(timeLabel);
                realtimeChart.data.datasets[0].data.push(data.speed);
                
                if (realtimeChart.data.labels.length > 30) {
                    realtimeChart.data.labels.shift();
                    realtimeChart.data.datasets[0].data.shift();
                }
                realtimeChart.update('none');
            });

            // Fast refresh configuration for high-speed aviation and jet positioning tracking logs
            watchId = navigator.geolocation.watchPosition(
                streamPosition, 
                err => console.log(err),
                { enableHighAccuracy: true, maximumAge: 0, timeout: 2000 }
            );

            btn.innerText = "STOP CALCULATING";
            btn.classList.add('active');
            isStreaming = true;
        } else {
            if (watchId) navigator.geolocation.clearWatch(watchId);
            if (socket) {
                socket.emit('stop_calculation');
                socket.disconnect();
            }
            btn.innerText = "START CALCULATING";
            btn.classList.remove('active');
            isStreaming = false;
            clientLat = null; clientLng = null; clientTs = null;
        }
    }

    function streamPosition(pos) {
        if (!isStreaming) return;

        const lat = pos.coords.latitude;
        const lng = pos.coords.longitude;
        const ts = pos.timestamp;
        let calculatedSpeed = null;

        if (pos.coords.speed !== null && pos.coords.speed >= 0) {
            calculatedSpeed = pos.coords.speed;
        } else if (clientLat !== null && clientLng !== null && clientTs !== null) {
            const timeDelta = ts - clientTs;
            calculatedSpeed = computeLocalFallbackSpeed(clientLat, clientLng, lat, lng, timeDelta);
        }

        clientLat = lat;
        clientLng = lng;
        clientTs = ts;

        document.getElementById('geoCoords').innerText = lat.toFixed(6) + ", " + lng.toFixed(6);
        const currentLoc = [lat, lng];
        map.setView(currentLoc, map.getZoom(), { animate: false });
        vehicleMarker.setLatLng(currentLoc);
        pathPolyline.addLatLng(currentLoc);

        if (socket && socket.connected) {
            socket.emit('telemetry_ingress', {
                speed: calculatedSpeed,
                lat: lat,
                lng: lng,
                timestamp: ts
            });
        }
    }

    window.onload = () => { initMap(); initChart(); };
</script>
</body>
</html>
